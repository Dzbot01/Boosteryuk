<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO dasar + Open Graph untuk preview link di WhatsApp/Telegram/Facebook.
         __SITE_URL__ diganti saat build oleh plugin `siteUrlPlugin` di vite.config.ts
         (VITE_SITE_URL → domain production Vercel → https://boosteryuk.com), karena
         WhatsApp mewajibkan URL gambar absolut. Gambar: public/og-image.jpg (1200×630 JPG,
         < 300 KB, rasio 1.91:1 sesuai syarat WhatsApp). -->
    <meta name="description" content="Boosteryuk — platform booster media sosial terpercaya: followers, likes, views & engagement untuk TikTok, Instagram, YouTube, Shopee, dan lainnya. Harga transparan, proses cepat, support 24/7." />
    <meta property="og:site_name" content="Boosteryuk" />
    <meta property="og:locale" content="id_ID" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="Boosteryuk — Booster Media Sosial Terpercaya" />
    <meta property="og:description" content="Followers, likes, views & engagement untuk TikTok, Instagram, YouTube, Shopee, dan lainnya. Harga transparan, proses cepat, support 24/7." />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg?v=3" />
    <meta property="og:image:secure_url" content="__SITE_URL__/og-image.jpg?v=3" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Tampilan beranda Boosteryuk — Turbo Speed, Fort Knox Security" />

    <!-- Twitter / X Preview -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Boosteryuk — Booster Media Sosial Terpercaya" />
    <meta name="twitter:description" content="Followers, likes, views & engagement untuk TikTok, Instagram, YouTube, Shopee, dan lainnya." />
    <meta name="twitter:image" content="__SITE_URL__/og-image.jpg?v=3" />
    <link rel="canonical" href="__SITE_URL__/" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <title>Boosteryuk — Booster Media Sosial Terpercaya</title>

    <script>
      /* 1. TANGKAP ERROR JS GLOBAL - MUNCUL ALERT */
      window.addEventListener('error', function(e) {
        alert('JS ERROR:\n' + e.message + '\nFile: ' + e.filename + '\nBaris: ' + e.lineno);
      });
      
      /* 2. TANGKAP PROMISE REJECT */
      window.addEventListener('unhandledrejection', function(e) {
        alert('PROMISE ERROR:\n' + (e.reason?.message || e.reason));
      });

      /* 3. Apply saved theme before first paint. Default = light. */
      try {
        var t = localStorage.getItem('bt-theme');
        if (t === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      } catch (e) {
        alert('THEME ERROR: ' + e.message);
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
